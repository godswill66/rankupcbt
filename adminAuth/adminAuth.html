<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | RankUp CBT</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --admin-primary: #6366f1;
        --admin-dark: #1e1b4b;
        --bg-main: #f8fafc;
        --danger: #ef4444;
      }

      body {
        font-family: "Inter", sans-serif;
        background: radial-gradient(circle at top right, #eef2ff, #f8fafc);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
      }

      .login-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 40px;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        border: 1px solid white;
        width: 100%;
        max-width: 400px;
        text-align: center;
      }

      .logo-icon {
        width: 60px;
        height: 60px;
        background: var(--admin-primary);
        color: white;
        border-radius: 16px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.8rem;
        margin: 0 auto 20px;
      }

      h1 {
        font-size: 1.4rem;
        color: var(--admin-dark);
        margin-bottom: 8px;
      }
      p.subtitle {
        color: #64748b;
        font-size: 0.9rem;
        margin-bottom: 30px;
      }

      .input-group {
        position: relative;
        margin-bottom: 15px;
        text-align: left;
      }
      .input-group label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: #475569;
        margin-bottom: 5px;
      }
      .input-group i {
        position: absolute;
        left: 15px;
        top: 38px;
        color: #94a3b8;
      }

      input {
        width: 100%;
        padding: 12px 15px 12px 42px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        outline: none;
        box-sizing: border-box;
        transition: 0.3s;
      }

      input:focus {
        border-color: var(--admin-primary);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
      }

      button {
        width: 100%;
        padding: 14px;
        background: var(--admin-primary);
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .spinner {
        display: none;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #error-msg {
        color: var(--danger);
        font-size: 0.8rem;
        margin-top: 15px;
        display: none;
        background: #fef2f2;
        padding: 10px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="logo-icon"><i class="fas fa-user-shield"></i></div>
      <h1>Admin Portal</h1>
      <p class="subtitle">Enter admin credentials</p>

      <form id="loginForm">
        <div class="input-group">
          <label>Username</label>
          <i class="fas fa-user"></i>
          <input
            type="text"
            id="adminUsername"
            placeholder="Admin Username"
            required
          />
        </div>

        <div class="input-group">
          <label>Password</label>
          <i class="fas fa-lock"></i>
          <input
            type="password"
            id="adminPassword"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit" id="loginBtn">
          <span id="btnText">Authorized Access</span>
          <div class="spinner" id="btnSpinner"></div>
        </button>
      </form>

      <p id="error-msg"></p>
    </div>
    <script>
      // Correct Base URL to match your server.js (app.use("/api/auth", ...))
      const API_BASE_URL = "https://rankupcbt-api-2.onrender.com/api/auth";

      document.getElementById("loginForm").onsubmit = async function (e) {
        e.preventDefault();

        const username = document.getElementById("adminUsername").value;
        const password = document.getElementById("adminPassword").value;
        const btnText = document.getElementById("btnText");
        const spinner = document.getElementById("btnSpinner");
        const errorMsg = document.getElementById("error-msg");
        const loginBtn = document.getElementById("loginBtn");

        // UI Feedback
        errorMsg.style.display = "none";
        btnText.style.display = "none";
        spinner.style.display = "block";
        loginBtn.disabled = true;

        try {
          // This now correctly targets https://rankupcbt-api-2.onrender.com/api/auth/admin/login
          const response = await fetch(`${API_BASE_URL}/admin/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          const data = await response.json();

          if (response.ok) {
            // MATCHED: We are using "rankup_token" just like your Dashboard script!
            localStorage.setItem("rankup_token", data.token);
            localStorage.setItem("rankup_admin_session", "active_logged_in");

            // Redirect to dashboard
            window.location.href = "../admin/addQuestions.html";
          } else {
            throw new Error(data.message || "Invalid Admin Credentials");
          }
        } catch (err) {
          errorMsg.innerText = err.message;
          errorMsg.style.display = "block";
          btnText.style.display = "block";
          spinner.style.display = "none";
          loginBtn.disabled = false;
        }
      };
    </script>
  </body>
</html>
