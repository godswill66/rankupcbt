<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RankUp | Professional CBT Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #5d5fef;
        --primary-dark: #4a4ce0;
        --secondary: #64748b;
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
        --bg-body: #f1f5f9;
        --surface: #ffffff;
        --text-main: #1e293b;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-body);
        color: var(--text-main);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* --- HEADER --- */
      .exam-header {
        background: var(--primary);
        color: white;
        padding: 0 25px;
        height: 65px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        z-index: 100;
      }

      .subject-switcher {
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.2);
        padding: 6px 12px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .subject-select {
        background: transparent;
        border: none;
        color: white;
        font-weight: 600;
        font-size: 0.95rem;
        outline: none;
        cursor: pointer;
      }

      .subject-select option { color: black; }

      .timer-pill {
        background: white;
        color: var(--danger);
        padding: 6px 18px;
        border-radius: 20px;
        font-weight: 800;
        font-family: monospace;
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* --- MAIN LAYOUT --- */
      .exam-layout {
        display: grid;
        grid-template-columns: 1fr 340px;
        flex: 1;
        overflow: hidden;
      }

      /* Left Side: Questions */
      .question-area {
        padding: 40px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .question-card {
        width: 100%;
        max-width: 800px;
        background: var(--surface);
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.03);
      }

      .q-meta {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        color: var(--secondary);
        font-weight: 600;
        font-size: 0.85rem;
        border-bottom: 1px solid #f1f5f9;
        padding-bottom: 15px;
      }

      .question-text {
        font-size: 1.25rem;
        line-height: 1.6;
        margin-bottom: 30px;
        font-weight: 600;
      }

      .options-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 110%;
      }
      ::-webkit-scrollbar{
        background-color: orange;
      }
      .option {
        display: flex;
        align-items: center;
        padding: 16px 20px;
        border: 2px solid #f1f5f9;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .option:hover { border-color: var(--primary); background: #f8faff; }
      .option.selected { border-color: var(--primary); background: #f1f5ff; }

      .option-tag {
        width: 32px;
        height: 32px;
        background: #f1f5f9;
        border-radius: 6px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-right: 15px;
        font-weight: 700;
        font-size: 0.9rem;
      }

      .option.selected .option-tag { background: var(--primary); color: white; }

      /* Right Side: Sidebar */
      .sidebar {
        background: white;
        border-left: 1px solid #e2e8f0;
        padding: 25px;
        display: flex;
        flex-direction: column;
      }

      .sidebar-section { margin-bottom: 25px; }
      .sidebar-label { 
        font-size: 0.75rem; 
        text-transform: uppercase; 
        font-weight: 700; 
        color: var(--secondary); 
        margin-bottom: 15px;
        display: block;
      }

      .nav-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }

      .grid-item {
        aspect-ratio: 1;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
      }

      .grid-item.active { border: 2px solid var(--primary); color: var(--primary); }
      .grid-item.done { background: var(--primary); color: white; border: none; }
      .grid-item.flagged { background: var(--warning); color: white; border: none; }

      /* --- FOOTER --- */
      .exam-footer {
        height: 75px;
        background: white;
        border-top: 1px solid #e2e8f0;
        padding: 0 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .btn {
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        border: none;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: 0.2s;
      }

      .btn-prev { background: #f1f5f9; color: var(--secondary); }
      .btn-next { background: var(--primary); color: white; }
      .btn-submit { background: var(--success); color: white; }
      .btn-calc { background: #334155; color: white; }

      /* --- CALCULATOR POPUP --- */
      #calc-modal {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #334155;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        z-index: 1000;
      }

      @media (max-width: 900px) {
        .exam-layout { grid-template-columns: 1fr; }
        .sidebar { display: none; }
      }
    </style>
  </head>
  <body>

    <header class="exam-header">
      <div class="subject-switcher">
        <i class="fa-solid fa-layer-group"></i>
        <select class="subject-select" id="subject-dropdown">
          <option value="bio">Biology</option>
          <option value="eng">English Language</option>
          <option value="math">Mathematics</option>
          <option value="phy">Physics</option>
          <option value="chem">Chemistry</option>
        </select>
      </div>

      <div class="timer-pill">
        <i class="fa-regular fa-clock"></i>
        <span id="timer">59:59</span>
      </div>

      <div style="font-size: 0.9rem; font-weight: 600;">
        ID: <span style="opacity: 0.8;">RankUp-8821</span>
      </div>
    </header>

    <div class="exam-layout">
      <main class="question-area">
        <div class="question-card">
          <div class="q-meta">
            <span>QUESTION 14 OF 40</span>
            <button onclick="toggleFlag()" id="flag-ui" style="background:none; border:none; color:var(--secondary); cursor:pointer;">
              <i class="fa-solid fa-flag"></i> FLAG FOR REVIEW
            </button>
          </div>

          <h2 class="question-text">
            Which of the following cell organelles is responsible for the synthesis of proteins in a cell?
          </h2>

          <div class="options-container">
            <div class="option" onclick="handleSelect(this, 'A')">
              <div class="option-tag">A</div>
              <span>Mitochondria</span>
            </div>
            <div class="option" onclick="handleSelect(this, 'B')">
              <div class="option-tag">B</div>
              <span>Ribosomes</span>
            </div>
            <div class="option" onclick="handleSelect(this, 'C')">
              <div class="option-tag">C</div>
              <span>Nucleus</span>
            </div>
            <div class="option" onclick="handleSelect(this, 'D')">
              <div class="option-tag">D</div>
              <span>Golgi Apparatus</span>
            </div>
          </div>
        </div>
      </main>

      <aside class="sidebar">
        <div class="sidebar-section">
          <span class="sidebar-label">Exam Progress</span>
          <div class="nav-grid" id="nav-grid">
            </div>
        </div>

        <div style="margin-top: auto;">
          <button class="btn btn-calc" style="width: 100%;" onclick="toggleCalc()">
            <i class="fa-solid fa-calculator"></i> Exam Calculator
          </button>
        </div>
      </aside>
    </div>

    <footer class="exam-footer">
      <button class="btn btn-prev"><i class="fa-solid fa-arrow-left"></i> Previous</button>
      
      <div style="display: flex; gap: 12px;">
        <button class="btn btn-next">Next Question <i class="fa-solid fa-arrow-right"></i></button>
        <button class="btn btn-submit" onclick="submitTest()">Submit Examination</button>
      </div>
    </footer>

    <div id="calc-modal">
        <div style="display:flex; justify-content:space-between; color:white; margin-bottom:10px;">
            <span>Calculator</span>
            <span onclick="toggleCalc()" style="cursor:pointer;">&times;</span>
        </div>
        <input type="text" style="width:100%; padding:10px; border-radius:4px; border:none;" value="0" disabled>
    </div>

    <script>
      // 1. Generate Question Grid
      const grid = document.getElementById('nav-grid');
      for (let i = 1; i <= 40; i++) {
        const item = document.createElement('div');
        item.className = 'grid-item';
        if (i === 14) item.classList.add('active');
        if (i < 10) item.classList.add('done');
        if (i === 5) item.classList.add('flagged');
        item.innerText = i;
        grid.appendChild(item);
      }

      // 2. Selection Logic
      function handleSelect(el, choice) {
        document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
        el.classList.add('selected');
        console.log("Selected: " + choice);
      }

      // 3. Flagging Logic
      function toggleFlag() {
        const flag = document.getElementById('flag-ui');
        flag.style.color = flag.style.color === 'rgb(245, 158, 11)' ? '#64748b' : '#f59e0b';
      }

      // 4. Timer Logic
      let seconds = 3600;
      const timerEl = document.getElementById('timer');
      setInterval(() => {
        seconds--;
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        timerEl.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
      }, 1000);

      // 5. Subject Switch Alert
      document.getElementById('subject-dropdown').addEventListener('change', (e) => {
        alert("Switching to " + e.target.options[e.target.selectedIndex].text + ". Questions will be updated.");
      });

      // 6. UI Toggles
      function toggleCalc() {
        const modal = document.getElementById('calc-modal');
        modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
      }

      function submitTest() {
        if(confirm("Are you sure you want to submit?")) {
            alert("Examination Submitted Successfully.");
        }
      }
    </script>
  </body>
</html>
