<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin RankUpcbt| Control Panel</title>
    <meta
      name="description"
      content="RankUp CBT is the ultimate JAMB Ranker. Practice past questions, track your performance against thousands of students, and boost your JAMB score for free."
    />
    <meta
      name="keywords"
      content="JAMB Ranker, JAMB CBT Practice, RankUp CBT, Nigeria exam preparation, UTME ranking, JAMB score tracker"
    />
    <meta name="author" content="RankUp CBT" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.rankupcbt.com/" />
    <meta
      property="og:title"
      content="RankUp CBT | The Best JAMB Ranker for 2026"
    />
    <meta
      property="og:description"
      content="See where you stand among thousands of candidates. Use our JAMB Ranker tool to predict your admission chances."
    />
    <meta property="og:image" content="/assets/logo.png" />

    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:title"
      content="RankUp CBT - Official JAMB Ranker"
    />

    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --admin-primary: #6366f1;
        --admin-dark: #1e1b4b;
        --bg-sidebar: #ffffff;
        --bg-main: #f8fafc;
        --text-main: #0f172a;
        --border: #e2e8f0;
        --danger: #ef4444;
        --success: #10b981;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }
      body {
        display: flex;
        background: var(--bg-main);
        min-height: 100vh;
        color: var(--text-main);
      }

      /* --- SIDEBAR --- */
      .sidebar {
        width: 260px;
        background: var(--bg-sidebar);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 30px 20px;
        position: fixed;
        height: 100vh;
        z-index: 100;
      }
      .admin-logo {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--admin-primary);
        margin-bottom: 40px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .nav-item {
        padding: 14px 18px;
        border-radius: 12px;
        text-decoration: none;
        color: var(--text-main);
        font-weight: 600;
        margin-bottom: 8px;
        transition: 0.3s;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .nav-item:hover,
      .nav-item.active {
        background: #f1f5ff;
        color: var(--admin-primary);
      }

      /* --- MAIN CONTENT --- */
      .main-content {
        margin-left: 260px;
        flex: 1;
        padding: 40px;
        width: calc(100% - 260px);
      }

      /* --- STATS --- */
      .header-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }
      .stat-card {
        background: white;
        padding: 25px;
        border-radius: 20px;
        border: 1px solid var(--border);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
      }
      .stat-card h3 {
        font-size: 0.85rem;
        color: #64748b;
        margin-bottom: 10px;
        text-transform: uppercase;
      }
      .stat-card p {
        font-size: 1.8rem;
        font-weight: 800;
      }

      /* --- TOOLBAR (SEARCH/FILTER) --- */
      .toolbar {
        display: flex;
        background: white;
        padding: 20px;
        border-radius: 20px;
        border: 1px solid var(--border);
        margin-bottom: 25px;
        gap: 15px;
        align-items: center;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
      }
      .search-box {
        flex: 1;
        position: relative;
      }
      .search-box i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
      }
      .search-box input {
        width: 100%;
        padding: 12px 15px 12px 45px;
        border: 1px solid var(--border);
        border-radius: 12px;
        outline: none;
      }
      select {
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: white;
        outline: none;
        min-width: 150px;
      }

      /* --- DATA TABLE --- */
      .table-section {
        background: white;
        border-radius: 20px;
        border: 1px solid var(--border);
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th {
        background: #f8fafc;
        padding: 18px 20px;
        font-size: 0.8rem;
        text-transform: uppercase;
        color: #64748b;
        font-weight: 700;
      }
      td {
        padding: 18px 20px;
        border-top: 1px solid var(--border);
        font-size: 0.9rem;
        vertical-align: middle;
      }

      .question-text {
        max-width: 400px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .badge {
        padding: 5px 10px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .badge-bio {
        background: #dcfce7;
        color: #166534;
      }
      .badge-math {
        background: #e0e7ff;
        color: #4338ca;
      }
      .badge-eng {
        background: #fef3c7;
        color: #92400e;
      }

      .btn-action {
        padding: 8px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
        background: none;
        font-size: 1.1rem;
      }
      .btn-edit {
        color: var(--admin-primary);
      }
      .btn-delete {
        color: var(--danger);
      }
      .btn-action:hover {
        background: #f1f5ff;
        transform: scale(1.1);
      }

      /* --- PAGINATION --- */
      .pagination {
        display: flex;
        justify-content: center;
        gap: 8px;
        padding: 20px;
        background: white;
        border-top: 1px solid var(--border);
      }
      .page-btn {
        padding: 8px 15px;
        border: 1px solid var(--border);
        background: white;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.2s;
      }
      .page-btn.active {
        background: var(--admin-primary);
        color: white;
        border-color: var(--admin-primary);
      }
      .page-btn:hover:not(.active) {
        background: #f8fafc;
      }

      /* --- ADD FORM SECTION --- */
      .form-section {
        background: white;
        padding: 30px;
        border-radius: 20px;
        border: 1px solid var(--border);
        margin-bottom: 40px;
      }
      .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin: 15px 0;
      }
      .btn-submit {
        background: var(--admin-primary);
        color: white;
        padding: 15px;
        border: none;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        transition: 0.3s;
      }
      .btn-submit:hover {
        background: var(--admin-dark);
      }
      label {
        font-weight: 600;
        font-size: 0.85rem;
        margin-bottom: 5px;
        display: block;
      }
      input,
      textarea {
        border-radius: 10px;
        border: 1px solid var(--border);
        padding: 10px;
        outline: none;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="admin-logo">
        <i class="fas fa-user-shield"></i> RankUp Admin
      </div>
      <nav>
        <a href="#" class="nav-item active"
          ><i class="fas fa-chart-pie"></i> Dashboard</a
        >
        <a href="#" class="nav-item"
          ><i class="fas fa-book"></i> Manage Questions</a
        >
        <a href="#" class="nav-item"><i class="fas fa-users"></i> Students</a>
        <a href="#" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
      </nav>
      <div style="margin-top: auto">
        <a href="/" class="nav-item"
          ><i class="fas fa-sign-out-alt"></i> Back to Site</a
        >
      </div>
    </aside>

    <main class="main-content">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 30px;
        "
      >
        <h1>Admin Control Center</h1>
        <p id="current-date" style="color: #64748b; font-weight: 500"></p>
      </div>

      <div class="header-stats">
        <div class="stat-card">
          <h3>Total Students</h3>
          <p id="total-students">0</p>
        </div>
        <div class="stat-card">
          <h3>Database Size</h3>
          <p id="total-questions-stat">0</p>
        </div>
        <div class="stat-card">
          <h3>Active Today</h3>
          <p>0</p>
        </div>
      </div>

      <div class="form-section">
        <h2 style="margin-bottom: 20px">
          <i class="fas fa-plus-circle"></i> Rapid Question Upload
        </h2>
        <form id="questionForm">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px">
            <div>
              <label>Subject Category</label>
              <select id="subject" style="width: 100%" required>
                <option value="bio">Biology</option>
                <option value="math">Mathematics</option>
                <option value="eng">English</option>
                <option value="phy">Physics</option>
                <option value="chem">Chemistry</option>
              </select>
            </div>
            <div>
              <label>Correct Answer (Label)</label>
              <input
                type="text"
                id="correctLabel"
                style="width: 100%"
                placeholder="e.g. A"
                maxlength="1"
                required
              />
            </div>
          </div>
          <div style="margin-top: 15px">
            <label>Question Prompt</label>
            <textarea
              id="questionText"
              style="width: 100%; height: 80px"
              placeholder="Write the question here..."
              required
            ></textarea>
          </div>
          <div class="options-grid">
            <input type="text" id="optA" placeholder="Option A" required />
            <input type="text" id="optB" placeholder="Option B" required />
            <input type="text" id="optC" placeholder="Option C" required />
            <input type="text" id="optD" placeholder="Option D" required />
          </div>
          <button type="submit" class="btn-submit">Sync to Server</button>
        </form>
      </div>

      <h2 id="manage-questions" style="margin-bottom: 20px">
        Database Manager
      </h2>

      <div class="toolbar">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="Search by question text..."
            oninput="handleSearch()"
          />
        </div>
        <select id="subjectFilter" onchange="handleFilter()">
          <option value="all">All Subjects</option>
          <option value="bio">Biology</option>
          <option value="math">Mathematics</option>
          <option value="eng">English</option>
        </select>
        <button onclick="refreshData()" class="page-btn">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>

      <div class="table-section">
        <table>
          <thead>
            <tr>
              <th>Subject</th>
              <th>Question Snippet</th>
              <th>Correct</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="questions-tbody"></tbody>
        </table>
        <div class="pagination" id="pagination"></div>
      </div>
    </main>
    <script>
      document.getElementById("current-date").innerText =
        new Date().toDateString();

      const API_URL =
        "https://rankupcbt-api-2.onrender.com/api/admin/questions";
      let allQuestions = [];
      let filteredQuestions = [];
      let currentPage = 1;
      const rowsPerPage = 8;

      /* ===============================
LOAD QUESTIONS FROM BACKEND
=============================== */

      async function fetchQuestions() {
        try {
          const res = await fetch(API_URL);
          const data = await res.json();

          allQuestions = data;
          filteredQuestions = [...allQuestions];

          renderTable();
        } catch (error) {
          console.error("Failed to load questions", error);
        }
      }

      /* ===============================
RENDER TABLE
=============================== */

      function renderTable() {
        const tbody = document.getElementById("questions-tbody");
        tbody.innerHTML = "";

        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;

        const pageData = filteredQuestions.slice(start, end);

        document.getElementById("total-questions-stat").innerText =
          allQuestions.length.toLocaleString();

        pageData.forEach((q) => {
          tbody.innerHTML += `
      <tr>

        <td>
          <span class="badge badge-${q.subject}">
            ${q.subject}
          </span>
        </td>

        <td>
          <div class="question-text">
            ${q.questionText}
          </div>
        </td>

        <td>
          <strong>${q.correctAnswer}</strong>
        </td>
        <td>

          <button class="btn-action btn-edit"
          onclick="editItem('${q._id}')">

          <i class="fas fa-pen-to-square"></i>

          </button>

          <button class="btn-action btn-delete"
          onclick="deleteItem('${q._id}')">

          <i class="fas fa-trash-can"></i>

          </button>

        </td>

      </tr>
    `;
        });

        renderPagination();
      }

      /* ===============================
PAGINATION
=============================== */

      function renderPagination() {
        const totalPages = Math.ceil(filteredQuestions.length / rowsPerPage);
        const container = document.getElementById("pagination");

        container.innerHTML = "";

        for (let i = 1; i <= totalPages; i++) {
          container.innerHTML += `
      <button class="page-btn ${i === currentPage ? "active" : ""}"
      onclick="goToPage(${i})">

      ${i}

      </button>
    `;
        }
      }

      /* ===============================
SEARCH
=============================== */

      function handleSearch() {
        const term = document.getElementById("searchInput").value.toLowerCase();

        filteredQuestions = allQuestions.filter((q) =>
          q.questionText.toLowerCase().includes(term),
        );

        currentPage = 1;

        renderTable();
      }

      /* ===============================
FILTER BY SUBJECT
=============================== */

      function handleFilter() {
        const sub = document.getElementById("subjectFilter").value;

        filteredQuestions =
          sub === "all"
            ? [...allQuestions]
            : allQuestions.filter((q) => q.subject === sub);

        currentPage = 1;

        renderTable();
      }

      /* ===============================
DELETE QUESTION
=============================== */

      async function deleteItem(id) {
        if (!confirm("Delete this question permanently?")) return;

        await fetch(`${API_URL}/${id}`, {
          method: "DELETE",
        });

        fetchQuestions();
      }

      /* ===============================
EDIT QUESTION
=============================== */

      async function editItem(id) {
        const q = allQuestions.find((item) => item._id === id);

        const newText = prompt("Edit Question:", q.questionText);

        if (!newText) return;

        await fetch(`${API_URL}/${id}`, {
          method: "PUT",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify({
            questionText: newText,
          }),
        });

        fetchQuestions();
      }

      /* ===============================
CHANGE PAGE
=============================== */

      function goToPage(p) {
        currentPage = p;

        renderTable();
      }

      /* ===============================
REFRESH DATA
=============================== */

      function refreshData() {
        document.getElementById("searchInput").value = "";
        document.getElementById("subjectFilter").value = "all";

        filteredQuestions = [...allQuestions];

        renderTable();
      }

      /* ===============================
ADD QUESTION
=============================== */

      document.getElementById("questionForm").onsubmit = async (e) => {
        e.preventDefault();

        const data = {
          subject: document.getElementById("subject").value,

          questionText: document.getElementById("questionText").value,

          options: [
            { label: "A", text: optA.value },

            { label: "B", text: optB.value },

            { label: "C", text: optC.value },

            { label: "D", text: optD.value },
          ],

          correctAnswer: document
            .getElementById("correctLabel")
            .value.toUpperCase(),
        };

        await fetch(API_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify(data),
        });

        e.target.reset();

        fetchQuestions();

        alert("Question added successfully");
      };

      /* ===============================
INITIAL LOAD
=============================== */

      fetchQuestions();
    </script>
  </body>
</html>
